name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  # Every trigger above is caused by a CHANGE IN THIS REPO, so none of them can
  # detect a break caused by something outside it. That is not hypothetical:
  # krepis added a required `callsite_id` argument, this repo floated it on an
  # open `>=` range, and the suite broke on a tree nobody had touched. `main`
  # last ran CI on 2026-07-27 simply because nothing was pushed — while
  # `publish.yml` kept shipping to PyPI from that same tree (morning-signal-I132).
  #
  # A daily run is the smallest cadence that turns "broken and invisible" into
  # "broken and dated", matching pip-audit.yml's reasoning in this repo.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Cross-repo dep: PyPI first; git@main fallback if a new krepis pin lands
      # before the publish workflow finishes (branch refs go stale after merge).
      - name: Pre-install krepis (PyPI or git fallback)
        run: |
          python -m pip install --upgrade pip
          pip install "krepis[anthropic,openai]>=0.11.2" || \
            pip install "krepis[anthropic,openai] @ git+https://github.com/nousergon/krepis.git@main"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,google]

      # krepis >=0.59.15 (deps#155, merged 2026-08-17) fails every LLM call
      # closed without a gitleaks binary on PATH — its DLP scan runs
      # unconditionally before any request leaves the process, real API key
      # or not. Without this step every test exercising an LLM call path
      # (test_canary.py, test_claude_recovery.py, test_orchestration.py, ...)
      # fails with "DLP scan blocked outbound request: gitleaks binary not
      # found on PATH", which is exactly what happened to `main` from
      # 2026-08-19 onward. Mirrors krepis's own test.yml step verbatim (same
      # version/hash) — that repo hit this first and pinned the fix.
      - name: Install gitleaks (for krepis DLP-gated tests)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # Minimal config so the DLP scan runs against something real
          # instead of erroring on a missing config dir.
          sudo mkdir -p /opt/groom-llm-routing
          printf '[extend]\nuseDefault = true\n' | sudo tee /opt/groom-llm-routing/gitleaks-egress.toml > /dev/null

      - name: Run pytest with coverage
        run: pytest

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
