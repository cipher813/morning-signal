name: Live API Smoke

# Catches Anthropic payload-shape regressions that the mocked unit-test
# suite cannot see (e.g. the 2026-05-26 server-tool ⊥ assistant-prefill
# HTTP 400 that slipped past CI because tests mock messages.create()).
#
# Retired the live network dispatch to Anthropic on 2026-08-29 (Brian
# ruling: "we shouldn't be using the anthropic api at all" — direct-
# Anthropic API budget is $0; morning-signal-I165). tests/live_api_smoke.py
# now builds the exact production payload shape and runs
# krepis.anthropic_payload.validate_payload against it — a static,
# deterministic, offline check that already covers the 2026-05-26 incident
# class (that validator is the SAME producer-side chokepoint the krepis
# anthropic transport runs at call-construction time). No secret, no
# network call, no per-run cost, no fork-secret-gate special case needed —
# every PR runs it, forks included.
#
# Triggers ONLY on PRs whose diff touches files that affect the payload
# shape. Other PRs (test-only refactors, docs, CI config unrelated to the
# smoke) skip this workflow entirely.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/morning_signal/claude.py"
      - "prompt.md"
      - "prompt_weekend.md"
      - "config.yaml*"
      - "pyproject.toml"
      - "tests/live_api_smoke.py"
      - ".github/workflows/live-api-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pre-install krepis (PyPI or git fallback)
        run: |
          python -m pip install --upgrade pip
          pip install "krepis>=0.10.3" || \
            pip install "krepis @ git+https://github.com/nousergon/krepis.git@main"

      - name: Install package
        run: |
          pip install -e .

      - name: Payload-shape smoke check (no network call, no credential)
        run: python tests/live_api_smoke.py
